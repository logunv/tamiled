<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TamilED Games</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .top-banner {
      width: 100%;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); /* Elegant blue gradient */
      color: #ffffff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
	.title {
		color:red
	}

    .banner-brand {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .banner-brand span {
      color: #ffcc00;
    }

	.banner-title {
		color: #ffffff;
		text-decoration: none;
		font-size: 18px;
		transition: color 0.3s ease;
		//font-family: 'Fredoka', cursive, sans-serif;
	}
	
    .banner-nav a {
      color: #ffffff;
      text-decoration: none;
      margin-left: 20px;
      font-size: 16px;
      transition: color 0.3s ease;
    }

    .banner-nav a:hover {
      color: #ffcc00;
    }

    @media (max-width: 600px) {
      .top-banner {
        flex-direction: column;
        text-align: center;
        gap: 10px;
      }

      .banner-nav a {
        margin: 0 10px;
      }
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	  -min-height: 100vh;
	  min-height: auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      //---background-color: #f4f4f9;
	  background-image: url('background.jpg');		
	  //---font-family: Arial, sans-serif;
	  margin: 0;
	  //---padding: 0px 0px 40px 0px;          
	  //---justify-content: center;
	}

    .site-footer {
      background-color: #1a1a2e;
      color: #ffffff;
      padding: 20px 0;
      text-align: center;
      margin-top: auto;
	  position: fixed;
	  bottom: 0;
	  width: 100%;
	}

    .footer-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }


    .footer-copyright {
      font-size: 0.85rem;
      color: #a0a0a0;
    }


        .container {
            display: flex;
            gap: 40px;
            max-width: 800px;
            width: 100%;
			padding: 40px;
        }

        .column {
            flex: 1;
            background-color: #ffffff;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .column h2 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }

        .column ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .column li {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            color: #555;
            font-size: 30px;
        }

        .column li:last-child {
            border-bottom: none;
        }

        /* Responsive design for smaller screens */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
                gap: 20px;
            }
        }

		.heading {
			padding:10px 0 0 0;
			font-family: 'Fredoka', cursive, sans-serif;
			font-size: 2.0rem;
		}
		</style>
</head>

<body>
  <header class="top-banner">
    <div class="banner-brand">
      Tamil<span>ED</span>
    </div>
	<div class="banner-title">Test Title</div>
    <nav class="banner-nav">
      <a href="#home">Home</a>
      <a href="#about">About Us</a>
      <a href="mailto:logunv@gmail.com">Contact</a>
    </nav>
  </header>
  <center>


    </div>
</body>

</html>
