<!DOCTYPE html>
<html>
  <head>
    <title>TamilED Fish Bowl for Beginners</title>
    <meta charset="UTF-8">
    <style>
    // this helps to keep the banner on top without space
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
		body {
			background-image: url('../../images/background.jpg');
		}

      #word1 {
       font-size:120px;
      }
      header {
       --padding: 10px;
       margin-bottom: 10px;

       font-size: 30px;
       color: white;
       background: black;
      }
      .button {
       width:400px;
       height:70px;
       font-size: 40px;
       color: white;
       background: blue;
       border-radius: 12px;
      }
      .button:hover {
        cursor: progress;
        background: red;
      }
      td {
        background: black;
        color: white;
      }
    header {
      width: 100%;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); /* Elegant blue gradient */
      color: white;
      --padding: 5px 0px 10px 0px;
      -display: flex;
      justify-content: space-between;
      align-items: center;
      -box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      font-family: 'Fredoka', cursive, sans-serif;        
          text-align: center;
      font-size: 30px;
    }

    .top-banner {
      width: 100%;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); /* Elegant blue gradient */
      color: #ffffff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .banner-brand {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
    } 
    .banner-brand span {
      color: #ffcc00;
    }
    .banner-title {
        color: #ffffff;
        text-decoration: none;
        font-size: 20px;
        transition: color 0.3s ease;
        justify-content: space-between;
        //font-family: 'Fredoka', cursive, sans-serif;
        align: center;
    }   
    .home {
      color:white !important;
    }
  </style>
</head>
<body onload="focus()" >
  <header class="top-banner">
    <div class="banner-brand"> 
      <a href="index.html"><span class=home>Tamil</span><span>ED</span></a>
    </div>
    <div class="banner-title">Fish Bowl for Beginners</div>
    <nav class="banner-nav"></nav>
  </header>
    </style>
  </head>

  <center>
    <table>
      <tr>
        <td width=1024 id=dice1 align=center><img width=100% height=666 src=rusty.jpg /></td>
      </tr>
    </table>
	<p>
    <button onclick="rollDice()" id=roll class=button type="button">Roll</button> 

	<script>
    var words = ['',
		'aamai.png',
		'banana.png',
		'dosai.png',
		'goyyaa.png',
		'idli.png',
		'kaagam.png',
		'kaal.png',
		'kai.png',
		'karuppu.png',
		'kozhi.png',
		'kudhirai.png',
		'maanga.png',
		'muyal.png',
		'mayil.png',
		'naay.png',
		'pachchai.png',
		'poonai.png',
		'singam.png',
		'soru.png',
		'thalai.png',
		'vellai.png',
	];
 
	function getRandom(w) {
		const length = w.length - 1;
    
		let r1 = Math.floor(Math.random() * length) + 1;
		word = w[r1];
		w.splice(r1, 1);
		return word;
	}

	function focus() {
		document.getElementById("roll").focus(); 
	}

	function rollDice() {
	    var btn = document.getElementById("roll");
	    document.getElementById("dice1").innerHTML = "";
	    btn.innerHTML = "Rolling...";
	    btn.style.background = "yellow";
	    btn.style.color = "black";
	    spin();
	    sleep(500).then(() => {
	      stopSpin();
	      var w = getRandom(words);
	      img1 = '<img id=word1 width=1024 height=666 align=center src="' + w + '"</img>';
	      document.getElementById("dice1").innerHTML = img1;
	      var ans = w.split('.')[0];
	      btn.innerHTML = "Roll";
	      btn.style.background = "blue";
	      btn.style.color = "white";
	      if(words.length <= 1) {
	          btn.innerHTML = "That's all folks!";
	          btn.style.background = "black";
	          btn.disabled = true;
	      }
	    });
	}
	var spinners = [ '',
     'single-dice-rolling.gif', 'giphy.gif', 'wheel.gif',
     'bird.gif', 'clock-animated-gif-9.gif',
     'clock-fast-white.gif', 'dice-rolling-gif-8.gif'
	];

	function spin() {
	    var length = spinners.length - 1;
	    var r1 = Math.floor(Math.random() * length) + 1;
	    var gif = spinners[r1];
	    spinner = "<center><img width=100% height=666 src=" + gif + " />";
	    document.getElementById("dice1").innerHTML = spinner;
	}

	function stopSpin() {
    	document.getElementById("dice1").innerHTML = "";
	}

	function sleep (time) {
    	return new Promise((resolve) => setTimeout(resolve, time));
	}

    </script>

  </body>

</html>
