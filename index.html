  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .top-banner {
      width: 100%;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); /* Elegant blue gradient */
      color: #ffffff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .banner-brand {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .banner-brand span {
      color: #ffcc00;
    }
	.banner-title {
		color: #ffffff;
		text-decoration: none;
		font-size: 20px;
		transition: color 0.3s ease;
		justify-content: space-between;
		//font-family: 'Fredoka', cursive, sans-serif;
	}
	

    .banner-nav a {
      color: #ffffff;
      text-decoration: none;
      margin-left: 20px;
      font-size: 16px;
      transition: color 0.3s ease;
    }

    .banner-nav a:hover {
      color: #ffcc00;
    }

    @media (max-width: 600px) {
      .top-banner {
        flex-direction: column;
        text-align: center;
        gap: 10px;
      }

      .banner-nav a {
        margin: 0 10px;
      }
    }
    body {

        .container {

        .column li:last-child {

        }

        /* Responsive design for smaller screens */
        @media (max-width: 600px) {
